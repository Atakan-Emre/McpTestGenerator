# Publish to PyPI
# Publishes automatically on release and can be run manually.

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Resolve package version
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          version = tomllib.loads(pyproject.read_text())["project"]["version"]
          print(f"PACKAGE_VERSION={version}")
          with open("/tmp/package_version.env", "w") as f:
              f.write(f"PACKAGE_VERSION={version}\n")
          PY
          cat /tmp/package_version.env >> "$GITHUB_ENV"

      - name: Validate PyPI credentials
        run: |
          if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "::error::Missing PYPI_API_TOKEN secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --skip-existing

      - name: Verify PyPI upload
        run: |
          sleep 60  # Wait for PyPI to process
          pip install qa-mcp==${PACKAGE_VERSION} || echo "Package may still be processing on PyPI"
