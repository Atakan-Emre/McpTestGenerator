# SonarQube configuration for QA-MCP.
#
# Report paths match the artifacts produced by the Makefile targets, so
# `make ci` followed by `make sonar` reproduces a CI analysis locally.
# sonar.projectVersion is supplied on the command line by the `sonar` target
# and by the Jenkins pipeline, so it never drifts from __version__.

sonar.projectKey=qa-mcp
sonar.projectName=QA-MCP
sonar.organization=

# --- Sources -----------------------------------------------------------------
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11,3.12

# --- Externally produced reports ---------------------------------------------
# Coverage and test execution
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.junit.reportPaths=reports/junit.xml

# Static analysis (Ruff import requires SonarQube 10.2+; drop the line on older
# servers rather than leaving it pointing at a report nothing reads)
sonar.python.ruff.reportPaths=reports/ruff.json
sonar.python.mypy.reportPaths=reports/mypy.txt
sonar.python.bandit.reportPaths=reports/bandit.json

# --- Exclusions --------------------------------------------------------------
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  .venv/**,\
  reports/**,\
  dist/**,\
  build/**,\
  docs/**

# Tests are analysed for issues but must not count towards coverage of the
# product code.
sonar.coverage.exclusions=\
  tests/**,\
  **/__init__.py

# Generated report bodies and fixture JSON are data, not code under review.
sonar.cpd.exclusions=\
  src/qa_mcp/resources/standards.py,\
  src/qa_mcp/prompts/templates.py,\
  src/qa_mcp/core/schemas.py
