[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-mcp"
version = "2.0.0"
description = "QA-MCP: Test Standardization & Orchestration Server - MCP server for test case generation, quality control, and Xray integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Atakan Emre", email = "contact@atakanemre.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "qa",
    "testing",
    "test-automation",
    "xray",
    "jira"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=2.1.0,<3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "jsonschema>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.5.0",
]
ci = [
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "build>=1.2.0",
]
jira = [
    "jira>=3.8.0",
]

[project.scripts]
qa-mcp = "qa_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Atakan-Emre/McpTestGenerator"
Documentation = "https://github.com/Atakan-Emre/McpTestGenerator#readme"
Repository = "https://github.com/Atakan-Emre/McpTestGenerator"
Issues = "https://github.com/Atakan-Emre/McpTestGenerator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "W291", "SIM105", "C401", "E741"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
no_implicit_optional = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
