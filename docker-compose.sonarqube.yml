# Local SonarQube for developing and validating the analysis configuration.
#
#   docker compose -f docker-compose.sonarqube.yml up -d
#   # wait for http://localhost:9000 (admin/admin), create a token, then:
#   make ci
#   SONAR_TOKEN=<token> make sonar
#
# This stack is for local use only - it has no persistence tuning, no backups
# and default credentials, so do not expose it.

services:
  sonarqube:
    image: sonarqube:10-community
    container_name: qa-mcp-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Single-node local instance; Elasticsearch bootstrap checks are not useful here.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  db:
    image: postgres:16-alpine
    container_name: qa-mcp-sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: qa-mcp-sonar-scanner
    profiles: ["scan"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:?SONAR_TOKEN must be set}
    volumes:
      - .:/usr/src
    working_dir: /usr/src

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
